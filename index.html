<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
    <!-- PWA & Standalone App Meta Tags -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#090d16">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="https://cdn-icons-png.flaticon.com/512/5501/5501375.png">
  <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/5501/5501375.png">

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(err => console.log('SW reg fail:', err));
      });
    }
  </script>
  
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#17365d">
<title>Debt & EMI</title>
<style>
:root{--bg:#f4f7fb;--card:#fff;--text:#172033;--muted:#6b7280;--primary:#17365d;--accent:#2f80ed;--green:#27ae60;--orange:#f2994a;--red:#eb5757;--line:#e6eaf0}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:var(--text)}
.app{max-width:1100px;margin:auto;min-height:100vh}.top{background:linear-gradient(135deg,#17365d,#275b91);color:white;padding:22px 18px 18px;border-radius:0 0 24px 24px}.top h1{margin:0;font-size:24px}.top p{margin:6px 0 0;opacity:.8;font-size:13px}
nav{display:flex;gap:8px;overflow:auto;padding:12px 12px 4px;position:sticky;top:0;background:var(--bg);z-index:5}nav button{border:0;background:var(--card);padding:10px 14px;border-radius:20px;white-space:nowrap;color:var(--muted);font-weight:600}nav button.active{background:var(--primary);color:white}
main{padding:10px 14px 90px}.view{display:none}.view.active{display:block}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:15px;box-shadow:0 4px 18px #17365d0d}.kpi small{color:var(--muted);display:block}.kpi strong{font-size:21px;display:block;margin-top:7px}.section{margin-top:16px}.section h2{font-size:16px;margin:0 0 10px}.row{display:flex;justify-content:space-between;align-items:center;gap:12px}.item{padding:13px 0;border-bottom:1px solid var(--line)}.item:last-child{border:0}.name{font-weight:700}.sub{font-size:12px;color:var(--muted);margin-top:3px}.money{font-weight:800}.bar{height:8px;background:#edf1f6;border-radius:8px;overflow:hidden;margin-top:9px}.bar i{display:block;height:100%;background:var(--accent);border-radius:8px}.badge{font-size:11px;padding:4px 8px;border-radius:12px;background:#eef4ff;color:#245ca8}.badge.green{background:#e9f8ef;color:#187a3e}.badge.orange{background:#fff3e8;color:#b85c10}.form{display:grid;gap:10px}.form input,.form select{width:100%;padding:12px;border:1px solid var(--line);border-radius:12px;background:white;font-size:15px}.btn{border:0;background:var(--primary);color:white;padding:12px 15px;border-radius:12px;font-weight:700}.btn.secondary{background:#edf3fa;color:var(--primary)}.btn.danger{background:#feecec;color:#a92d2d}.actions{display:flex;gap:8px;flex-wrap:wrap}.chart{width:100%;height:190px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:10px}.chart svg{width:100%;height:100%}.hint{font-size:12px;color:var(--muted);line-height:1.5}.empty{padding:30px;text-align:center;color:var(--muted)}@media(max-width:700px){.grid{grid-template-columns:repeat(2,1fr)}.kpi strong{font-size:18px}}@media(min-width:900px){main{padding-left:24px;padding-right:24px}.top{padding-left:28px;padding-right:28px}}
</style>
</head>
<body>
<div class="app">
<header class="top"><h1>Debt & EMI</h1><p>Monthly commitments, progress and payoff predictions</p></header>
<nav id="nav">
<button data-v="dashboard" class="active">Dashboard</button><button data-v="update">Monthly Update</button><button data-v="trends">Trends</button><button data-v="predict">Predictions</button><button data-v="manage">Manage</button>
</nav>
<main>
<section id="dashboard" class="view active"></section>
<section id="update" class="view"></section>
<section id="trends" class="view"></section>
<section id="predict" class="view"></section>
<section id="manage" class="view"></section>
</main>
</div>
<script>
const seed=[
["Home Loan","Home Loan",3000000,35000,2950000,35000,.085,"Normal"],
["Personal Loan","Personal Loan",5300000,45000,5250000,45000,.12,"High"],
["Car Loan","Vehicle",2000000,30000,1850000,30000,.09,"Normal"],
["Phone EMI","Electronics",50000,5000,40000,5000,0,"Low"],
["Washing Machine","Appliance",25000,4000,17000,4000,0,"Low"],
["TV EMI","Electronics",45000,5000,35000,5000,0,"Low"],
["Credit Card","Credit Card",95000,10000,75000,10000,.18,"High"]
];
let data=JSON.parse(localStorage.getItem("debtData")||"null")||{months:["Aug-26","Sep-26","Oct-26"],items:seed.map(x=>({name:x[0],cat:x[1],original:x[2],emi:x[3],balance:x[4],prev:x[5],rate:x[6],priority:x[7],history:[x[2],x[4],x[4]]}))};
function save(){localStorage.setItem("debtData",JSON.stringify(data))}
const money=n=>"₹"+Math.round(n||0).toLocaleString("en-IN");
function latest(){return data.items.filter(x=>x.balance>0)}
function reduction(x){return Math.max(0,(x.prev||x.balance)-x.balance)}
function payoff(x){let h=x.history||[];let vals=h.slice(1).map((v,i)=>Math.max(0,(h[i]||v)-v)).filter(v=>v>0);let avg=vals.length?vals.reduce((a,b)=>a+b,0)/vals.length:x.emi||0;return avg?Math.ceil(x.balance/avg):null}
function finish(x){let m=payoff(x);if(!m)return "Need more history";let d=new Date();d.setMonth(d.getMonth()+m);return d.toLocaleString("en-IN",{month:"short",year:"numeric"})}
function nav(){document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>{document.querySelectorAll("nav button").forEach(x=>x.classList.remove("active"));b.classList.add("active");document.querySelectorAll(".view").forEach(x=>x.classList.remove("active"));document.getElementById(b.dataset.v).classList.add("active");render()})}
function dashboard(){
let a=latest(), total=a.reduce((s,x)=>s+x.balance,0), emi=a.reduce((s,x)=>s+x.emi,0), red=a.reduce((s,x)=>s+reduction(x),0);
let top=[...a].sort((x,y)=>y.balance-x.balance).slice(0,5);
return `<div class="grid">
<div class="card kpi"><small>Total outstanding</small><strong>${money(total)}</strong></div>
<div class="card kpi"><small>Monthly EMI</small><strong>${money(emi)}</strong></div>
<div class="card kpi"><small>Reduced this month</small><strong>${money(red)}</strong></div>
<div class="card kpi"><small>Active commitments</small><strong>${a.length}</strong></div></div>
<div class="section card"><div class="row"><h2>Where your money sits</h2><span class="badge">${data.months.at(-1)||""}</span></div>
${top.map(x=>`<div class="item"><div class="row"><div><div class="name">${x.name}</div><div class="sub">${x.cat} · EMI ${money(x.emi)}</div></div><div class="money">${money(x.balance)}</div></div><div class="bar"><i style="width:${Math.min(100,Math.max(4,(x.balance/x.original)*100))}%"></i></div></div>`).join("")}</div>
<div class="section card"><h2>Next focus</h2><div class="row"><div><div class="name">${[...a].sort((x,y)=>(y.balance/Math.max(1,reduction(y)))-(x.balance/Math.max(1,reduction(x))))[0]?.name||"—"}</div><div class="sub">Large balance relative to recent reduction; interest and priority should also be considered.</div></div><span class="badge orange">Review</span></div></div>`;
}
function update(){
return `<div class="card"><h2>Monthly update</h2><p class="hint">Enter the latest outstanding balance. The app calculates the reduction and keeps the history automatically.</p>
<div class="form"><input id="month" value="${data.months.at(-1)||""}" placeholder="Month e.g. Nov-26">
${data.items.map((x,i)=>`<div class="item"><div class="row"><div><div class="name">${x.name}</div><div class="sub">Previous ${money(x.balance)}</div></div><input data-i="${i}" class="bal" type="number" value="${x.balance}" style="max-width:150px"></div></div>`).join("")}
<button class="btn" id="saveMonth">Save monthly update</button></div></div>`;
}
function trends(){
let vals=data.items.map(x=>({n:x.name, h:x.history||[]})); let all=[];
for(let i=0;i<Math.max(...vals.map(x=>x.h.length));i++) all.push(vals.reduce((s,x)=>s+(x.h[i]||0),0));
let max=Math.max(...all,1), pts=all.map((v,i)=>`${(i/(Math.max(all.length-1,1)))*100},${175-(v/max)*150}`).join(" ");
return `<div class="section"><h2>Overall outstanding trend</h2><div class="chart"><svg viewBox="0 0 100 190" preserveAspectRatio="none"><polyline fill="none" stroke="#2f80ed" stroke-width="2" points="${pts}"/></svg></div></div>
<div class="section card"><h2>Metric-wise trend</h2>${vals.map(x=>`<div class="item"><div class="row"><span class="name">${x.n}</span><span>${money(x.h.at(-1)||0)}</span></div><div class="sub">${x.h.map((v,i)=>`${data.months[i]||"Month "+(i+1)}: ${money(v)}`).join(" · ")}</div></div>`).join("")}</div>
<div class="section card"><h2>Category-wise current outstanding</h2>${Object.entries(latest().reduce((o,x)=>(o[x.cat]=(o[x.cat]||0)+x.balance,o),{})).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<div class="item"><div class="row"><span class="name">${k}</span><span class="money">${money(v)}</span></div></div>`).join("")}</div>`;
}
function predict(){
let a=latest().map(x=>({...x,m:payoff(x)})).sort((x,y)=>(x.m||999)-(y.m||999));
return `<div class="card"><h2>Payoff predictions</h2><p class="hint">Forecast uses each commitment's observed monthly balance reduction. More monthly history makes this more reliable.</p>${a.map(x=>`<div class="item"><div class="row"><div><div class="name">${x.name}</div><div class="sub">Balance ${money(x.balance)} · Average reduction ${money(x.m?x.balance/x.m:0)}/mo</div></div><span class="badge ${x.m&&x.m<=3?"green":""}">${x.m?finish(x):"Need history"}</span></div>
<div class="sub">${x.m&&x.m<=3?"FINISH SOON — this commitment may release its EMI shortly.":x.priority==="High"?"HIGH PRIORITY — review after mandatory payments.":"Continue monthly tracking."}</div></div>`).join("")}</div>
<div class="section card"><h2>Cash-flow opportunities</h2>${a.filter(x=>x.m&&x.m<=6).map(x=>`<div class="item"><div class="row"><span><b>${x.name}</b> may finish around ${finish(x)}</span><span class="money">+${money(x.emi)}/mo</span></div></div>`).join("")||'<div class="empty">No commitment is currently projected to finish within 6 months.</div>'}</div>`;
}
function manage(){
return `<div class="card"><h2>Add commitment</h2><div class="form">
<input id="n" placeholder="Name e.g. Laptop EMI"><select id="c"><option>Electronics</option><option>Home Loan</option><option>Personal Loan</option><option>Vehicle</option><option>Appliance</option><option>Credit Card</option><option>Other</option></select>
<input id="o" type="number" placeholder="Original amount"><input id="e" type="number" placeholder="Monthly EMI"><input id="b" type="number" placeholder="Current outstanding"><input id="r" type="number" step=".01" placeholder="Interest rate %"><select id="p"><option>Low</option><option>Normal</option><option>High</option></select><button class="btn" id="add">Add commitment</button></div></div>
<div class="section card"><h2>Current commitments</h2>${data.items.map((x,i)=>`<div class="item"><div class="row"><div><div class="name">${x.name}</div><div class="sub">${x.cat} · ${money(x.balance)}</div></div><button class="btn danger" data-del="${i}">Remove</button></div></div>`).join("")}</div>`;
}
function bind(){
document.getElementById("saveMonth")?.addEventListener("click",()=>{let m=document.getElementById("month").value.trim();if(!m)return; if(!data.months.includes(m))data.months.push(m);document.querySelectorAll(".bal").forEach(el=>{let x=data.items[+el.dataset.i];x.prev=x.balance;x.balance=+el.value||0;x.history=x.history||[];x.history.push(x.balance)});save();render();alert("Monthly update saved.")});
document.getElementById("add")?.addEventListener("click",()=>{let n=document.getElementById("n").value.trim();let b=+document.getElementById("b").value||0;if(!n||!b)return alert("Enter at least a name and outstanding balance.");data.items.push({name:n,cat:document.getElementById("c").value,original:+document.getElementById("o").value||b,emi:+document.getElementById("e").value||0,balance:b,prev:b,rate:(+document.getElementById("r").value||0)/100,priority:document.getElementById("p").value,history:[b]});save();render()});
document.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>{data.items.splice(+b.dataset.del,1);save();render()});
}
function render(){dashboardEl.innerHTML=dashboard();updateEl.innerHTML=update();trendsEl.innerHTML=trends();predictEl.innerHTML=predict();manageEl.innerHTML=manage();bind()}
const dashboardEl=document.getElementById("dashboard"),updateEl=document.getElementById("update"),trendsEl=document.getElementById("trends"),predictEl=document.getElementById("predict"),manageEl=document.getElementById("manage");nav();render();
</script>
</body>
</html>
