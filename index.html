<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#090d16">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="DebtTracker">
  <title>Debt & EMI Manager</title>
  
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" href="https://cdn-icons-png.flaticon.com/512/5501/5501375.png">

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            app: {
              bg: '#090d16',
              card: '#121827',
              border: '#1e293b',
              accent: '#6366f1',
              accentDark: '#4f46e5',
              success: '#10b981',
              danger: '#f43f5e',
              warning: '#f59e0b',
              surface: '#182234'
            }
          },
          fontFamily: {
            sans: ['Inter', '-apple-system', 'BlinkMacSystemFont', 'sans-serif'],
          }
        }
      }
    }
  </script>

  <!-- Chart.js & FontAwesome -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');
    * { -webkit-tap-highlight-color: transparent; }
    body {
      font-family: 'Inter', sans-serif;
      background-color: #090d16;
      color: #f1f5f9;
      overscroll-behavior-y: contain;
    }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    .glass-card {
      background: linear-gradient(145deg, rgba(24, 34, 52, 0.85) 0%, rgba(18, 24, 39, 0.95) 100%);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.07);
    }
    .active-nav { color: #818cf8 !important; }
    .safe-bottom { padding-bottom: max(1.2rem, env(safe-area-inset-bottom)); }
    .safe-top { padding-top: max(0.8rem, env(safe-area-inset-top)); }
  </style>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js', { scope: './' }).catch(err => console.log(err));
      });
    }
  </script>
</head>
<body class="bg-app-bg text-slate-100 min-h-screen flex flex-col justify-between selection:bg-indigo-500 selection:text-white pb-28">

  <!-- ================= AUTH MODAL (LOGIN & SIGN UP) ================= -->
  <section id="authSection" class="fixed inset-0 z-50 bg-app-bg/98 backdrop-blur-xl flex flex-col justify-center items-center px-4 overflow-y-auto">
    <div class="w-full max-w-sm glass-card p-6 rounded-3xl border border-slate-700/80 shadow-2xl relative my-auto">
      
      <!-- Brand Logo -->
      <div class="flex justify-center mb-3">
        <div class="w-12 h-12 rounded-2xl bg-gradient-to-tr from-indigo-600 via-indigo-500 to-cyan-400 flex items-center justify-center text-white text-xl shadow-lg shadow-indigo-500/30">
          <i class="fa-solid fa-wallet"></i>
        </div>
      </div>

      <!-- High-Contrast Segmented Tabs -->
      <div class="bg-slate-900/90 p-1 rounded-2xl flex border border-slate-800 mb-4">
        <button type="button" id="tabBtnSignIn" onclick="switchAuthTab('login')" class="flex-1 py-2 text-xs font-bold rounded-xl transition text-white bg-indigo-600 shadow cursor-pointer">
          Sign In
        </button>
        <button type="button" id="tabBtnSignUp" onclick="switchAuthTab('signup')" class="flex-1 py-2 text-xs font-bold rounded-xl transition text-slate-400 hover:text-white cursor-pointer">
          Sign Up
        </button>
      </div>

      <!-- Inline Notification Banner -->
      <div id="authBanner" class="hidden mb-4 p-3 rounded-xl text-xs font-medium flex items-center gap-2"></div>

      <!-- 1. SIGN IN FORM -->
      <form id="signInForm" class="space-y-3.5">
        <div>
          <h2 class="text-base font-bold text-center text-white">Welcome Back</h2>
          <p class="text-xs text-slate-400 text-center mt-0.5">Sign in to manage your debts & forecast</p>
        </div>

        <div>
          <label class="block text-[11px] font-semibold text-slate-300 mb-1">Email Address</label>
          <input type="email" id="loginEmail" required placeholder="name@example.com" class="w-full bg-slate-900/90 border border-slate-700 rounded-xl px-3 py-2.5 text-xs text-white placeholder-slate-500 focus:border-indigo-500 focus:outline-none">
        </div>

        <div>
          <div class="flex justify-between items-center mb-1">
            <label class="block text-[11px] font-semibold text-slate-300">Password</label>
            <button type="button" onclick="togglePasswordVisibility('loginPassword', 'eyeIconLogin')" class="text-[11px] text-indigo-400 font-medium flex items-center gap-1 cursor-pointer">
              <i id="eyeIconLogin" class="fa-regular fa-eye"></i> Show
            </button>
          </div>
          <input type="password" id="loginPassword" required placeholder="••••••••" class="w-full bg-slate-900/90 border border-slate-700 rounded-xl px-3 py-2.5 text-xs text-white placeholder-slate-500 focus:border-indigo-500 focus:outline-none">
        </div>

        <button type="submit" id="btnSubmitLogin" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-3 rounded-xl text-xs transition active:scale-98 shadow-md shadow-indigo-600/30 cursor-pointer mt-2">
          Sign In
        </button>
      </form>

      <!-- 2. SIGN UP FORM -->
      <form id="signUpForm" class="hidden space-y-3.5">
        <div>
          <h2 class="text-base font-bold text-center text-white">Create New Account</h2>
          <p class="text-xs text-slate-400 text-center mt-0.5">Set up your personal debt tracker account</p>
        </div>

        <div>
          <label class="block text-[11px] font-semibold text-slate-300 mb-1">Full Name</label>
          <input type="text" id="regName" required placeholder="e.g. Suneel Kumar" class="w-full bg-slate-900/90 border border-slate-700 rounded-xl px-3 py-2.5 text-xs text-white placeholder-slate-500 focus:border-indigo-500 focus:outline-none">
        </div>

        <div>
          <label class="block text-[11px] font-semibold text-slate-300 mb-1">Email Address</label>
          <input type="email" id="regEmail" required placeholder="name@example.com" class="w-full bg-slate-900/90 border border-slate-700 rounded-xl px-3 py-2.5 text-xs text-white placeholder-slate-500 focus:border-indigo-500 focus:outline-none">
        </div>

        <div>
          <div class="flex justify-between items-center mb-1">
            <label class="block text-[11px] font-semibold text-slate-300">Create Password</label>
            <button type="button" onclick="togglePasswordVisibility('regPassword', 'eyeIconReg')" class="text-[11px] text-indigo-400 font-medium flex items-center gap-1 cursor-pointer">
              <i id="eyeIconReg" class="fa-regular fa-eye"></i> Show
            </button>
          </div>
          <input type="password" id="regPassword" required minlength="4" placeholder="••••••••" class="w-full bg-slate-900/90 border border-slate-700 rounded-xl px-3 py-2.5 text-xs text-white placeholder-slate-500 focus:border-indigo-500 focus:outline-none">
        </div>

        <button type="submit" id="btnSubmitSignup" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-3 rounded-xl text-xs transition active:scale-98 shadow-md shadow-indigo-600/30 cursor-pointer mt-2">
          Create Account
        </button>
      </form>

      <!-- Quick Guest / Demo Option -->
      <div class="mt-4 pt-4 border-t border-slate-800 text-center">
        <button type="button" onclick="continueAsGuest()" class="w-full py-2.5 px-3 rounded-xl bg-slate-800/80 hover:bg-slate-800 border border-slate-700 text-xs font-semibold text-slate-300 hover:text-white transition flex items-center justify-center gap-1.5 cursor-pointer active:scale-95">
          <i class="fa-solid fa-user-clock text-indigo-400"></i> Continue in Guest / Demo Mode
        </button>
      </div>

    </div>
  </section>

  <!-- ================= APP HEADER ================= -->
  <header class="sticky top-0 z-30 bg-app-bg/90 backdrop-blur-md border-b border-app-border/80 px-4 py-3 safe-top">
    <div class="max-w-md mx-auto flex items-center justify-between">
      <div class="flex items-center gap-2.5">
        <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-indigo-600 via-indigo-500 to-cyan-400 flex items-center justify-center text-white font-bold text-sm">
          <i class="fa-solid fa-scale-balanced"></i>
        </div>
        <div>
          <h1 class="text-sm font-bold tracking-tight text-white flex items-center gap-1.5">
            Debt & EMI Manager
            <span id="userBadge" class="text-[10px] font-semibold bg-indigo-500/20 text-indigo-400 px-1.5 py-0.5 rounded-full border border-indigo-500/30">User</span>
          </h1>
          <p id="userEmailDisplay" class="text-[11px] text-slate-400 truncate max-w-[180px]">Personal Portfolio</p>
        </div>
      </div>
      
      <div class="flex items-center gap-2">
        <button type="button" onclick="openCategoryModal()" class="w-8 h-8 rounded-full bg-slate-800 border border-slate-700 flex items-center justify-center text-slate-300 hover:text-white transition active:scale-95" title="Categories">
          <i class="fa-solid fa-tag text-xs"></i>
        </button>
        <button type="button" onclick="switchScreen('settingsScreen')" class="w-8 h-8 rounded-full bg-slate-800 border border-slate-700 flex items-center justify-center text-slate-300 hover:text-white transition active:scale-95" title="Settings">
          <i class="fa-solid fa-gear text-xs"></i>
        </button>
      </div>
    </div>
  </header>

  <!-- ================= MAIN VIEWPORT CONTAINER ================= -->
  <main class="max-w-md mx-auto w-full px-4 pt-4 flex-1">

    <!-- SCREEN 1: DASHBOARD -->
    <section id="dashboardScreen" class="app-screen space-y-4">
      <div class="glass-card rounded-3xl p-5 shadow-xl relative overflow-hidden">
        <div class="flex justify-between items-center mb-1">
          <span class="text-[11px] font-semibold tracking-wider text-slate-400 uppercase">Total Outstanding Debt</span>
          <span id="dashMonthBadge" class="text-[11px] font-semibold px-2 py-0.5 rounded-full bg-indigo-500/15 text-indigo-300 border border-indigo-500/25">Oct 2026</span>
        </div>
        
        <div class="flex items-baseline gap-2 mt-1">
          <span id="kpiTotalDebt" class="text-3xl font-extrabold text-white tracking-tight">₹0</span>
        </div>
        
        <div id="kpiReductionRow" class="flex items-center gap-1.5 mt-2 text-
